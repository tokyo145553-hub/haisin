<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEB 防災マルチビュー（配信ページ）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&display=swap">
<style>
:root {
    --chrome: #151a21;
    --chrome-2: #1d242d;
    --line: #2f3a47;
    --ink: #e8edf3;
    --dim: #8fa1b3;
    --acc: #ffb74d;
    --danger: #e0475b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
    font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; font-size: 13px; }
  button, input, select { font: inherit; color: inherit; }


/* ---------- ステージ（キャンバス）---------- */
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #000; overflow: hidden; }
  .panel { position: absolute; background: #000; overflow: hidden; }
  .panel .win { position: absolute; overflow: hidden; }
  .panel iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #0b0f14; }
  body.edit .panel iframe, body.cropping .panel iframe { pointer-events: none; }

  /* 編集モードの枠・つまみ */
  .ov { position: absolute; inset: 0; display: none; cursor: move; outline: 2px solid rgba(255,183,77,.45); outline-offset: -2px; touch-action: none; }
  body.edit:not(.bc):not(.cropping) .ov { display: block; }
  .panel.sel .ov { outline: 3px solid var(--acc); }
  .ov .tag { position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 4px; background: rgba(21,26,33,.88); font-weight: 700; pointer-events: none; }
  .ov .tag small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .ov .h { position: absolute; width: 16px; height: 16px; background: var(--acc); border: 2px solid #151a21; border-radius: 3px; display: none; }
  .panel.sel .ov .h { display: block; }
  .h[data-h="nw"] { left: -2px; top: -2px; cursor: nwse-resize; } .h[data-h="n"] { left: calc(50% - 8px); top: -2px; cursor: ns-resize; }
  .h[data-h="ne"] { right: -2px; top: -2px; cursor: nesw-resize; } .h[data-h="e"] { right: -2px; top: calc(50% - 8px); cursor: ew-resize; }
  .h[data-h="se"] { right: -2px; bottom: -2px; cursor: nwse-resize; } .h[data-h="s"] { left: calc(50% - 8px); bottom: -2px; cursor: ns-resize; }
  .h[data-h="sw"] { left: -2px; bottom: -2px; cursor: nesw-resize; } .h[data-h="w"] { left: -2px; top: calc(50% - 8px); cursor: ew-resize; }

  /* 切り抜きモード */
  #backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.86); z-index: 900; display: none; }
  body.cropping #backdrop { display: block; }
  .cropbox { position: absolute; border: 2px solid var(--acc); box-shadow: 0 0 0 9999px rgba(0,0,0,.62); cursor: move; touch-action: none; }
  .cropbox .h { display: block; }
  .cropbox .size { position: absolute; left: 6px; top: 6px; padding: 2px 7px; border-radius: 4px; background: rgba(21,26,33,.9); font-size: 12px; pointer-events: none; white-space: nowrap; }

  
/* 切り抜き操作バー */
  #cropbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5200; display: none; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
    background: var(--chrome); border: 2px solid var(--acc); border-radius: 12px; padding: 10px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.6); }
  body.cropping #cropbar { display: flex; }
  #cropbar button { border: 1px solid var(--line); background: var(--chrome-2); border-radius: 7px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
  #cropbar button.primary { background: var(--acc); border-color: var(--acc); color: #1a1205; }
  #cropbar label { color: var(--dim); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #cropbar .msg { color: var(--ink); font-weight: 700; }


  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 6000; background: var(--chrome); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; display: none; }
#stage,.panel{background:var(--bg,#000)}
#safe{position:absolute;display:none;border:2px dashed rgba(255,183,77,.75);pointer-events:none;z-index:850}
body.edit #safe{display:block}
.tebov{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:800;color:#fff;font-weight:900;font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif}
.tebov *{box-sizing:border-box}
.tb-side{position:absolute;left:6px;top:6px;width:178px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tb-side span{writing-mode:vertical-rl;text-orientation:upright;line-height:1.05;white-space:nowrap}
.tb-top{position:absolute;top:0;right:0;height:104px;display:flex;align-items:center;gap:16px;padding:0 20px 0 6px;white-space:nowrap}
.tb-clock{font-size:92px;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;text-shadow:-4px -4px 0 var(--blue),4px -4px 0 var(--blue),-4px 4px 0 var(--blue),4px 4px 0 var(--blue),0 -5px 0 var(--blue),0 5px 0 var(--blue),-5px 0 0 var(--blue),5px 0 0 var(--blue)}
.tb-badge{background:var(--blue);padding:4px 14px;font-size:34px;border-radius:4px}
.tb-tag{background:var(--red);padding:2px 12px;font-size:32px;border-radius:5px;border:2px solid #fff}
.tb-place{font-size:46px;text-shadow:0 2px 8px #000;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-lv{margin-left:auto;display:flex;gap:8px;flex:none}
.tb-lv i{font-style:normal;display:flex;align-items:center;gap:10px;height:62px;padding:0 16px;border-radius:6px;font-size:28px;border:2px solid rgba(255,255,255,.4)}
.tb-lv b{font-size:30px}
.tb-hl{position:absolute;right:8px;height:108px;bottom:70px}
.tb-hl1{height:42px;margin-bottom:4px;background:#fff;color:#111;font-size:30px;line-height:42px;padding:0 22px;border-radius:8px 8px 0 0;white-space:nowrap;overflow:hidden}
.tb-hl2{height:62px;background:var(--red);font-size:50px;line-height:62px;padding:0 22px;border-radius:0 0 8px 8px;white-space:nowrap;overflow:hidden}
.tb-bar{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--bar);border-bottom:6px solid #a9c4ff;display:flex;align-items:stretch;overflow:hidden}
.tb-kb{background:var(--blue);color:#fff;font-size:30px;padding:0 22px;display:flex;align-items:center;white-space:nowrap;position:relative;z-index:2;margin:6px 0 6px 10px;border-radius:5px}
.tb-tk{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden;color:#111;height:100%}
.tb-track{display:flex;flex:none;align-items:center}
.tb-sp{display:block;flex:none;padding:0 36px;font-size:var(--fs,36px);white-space:nowrap}
.tb-track>.tb-sp{animation:tbM var(--dur,30s) linear infinite}
.tb-probe{position:absolute;visibility:hidden}
@keyframes tbM{from{transform:translateX(0)}to{transform:translateX(-100%)}}

</style>
</head>
<body>
<div id="stage"><div id="backdrop"></div><div id="safe"></div>
<div id="ov" class="tebov">
  <aside class="tb-side" id="sd"><span id="sTx"></span></aside>
  <header class="tb-top" id="tp"><b class="tb-clock" id="ck"></b><span class="tb-badge" id="bd"></span><span class="tb-tag" id="tg"></span><span class="tb-place" id="pl"></span><div class="tb-lv" id="lv"></div></header>
  <div class="tb-hl" id="hl"><div class="tb-hl1" id="h1"></div><div class="tb-hl2" id="h2"></div></div>
  <div class="tb-bar" id="br"><span class="tb-kb" id="kb"></span><div class="tb-tk" id="tk"></div></div>
</div></div>
<div id="cropbar">
  <span class="msg" id="cropMsg">切り抜く範囲をドラッグで選んでください</span>
  <label><input type="checkbox" id="cropLock" checked> 枠の縦横比に固定</label>
  <label><input type="checkbox" id="cropFit" checked> 適用後に枠の高さを合わせる</label>
  <button id="cropAll">全体に戻す</button>
  <button id="cropCancel">キャンセル</button>
  <button id="cropOk" class="primary">適用</button>
</div>


<div id="toast"></div>
<script>
/* ===== 共通：状態・同期（配信ページと設定ページで同じ内容）===== */
var KEY="teb-multiview-v2",K={SIDE:190,TOP:104,HL:108,TK:64,GAP:8};
var URLS={typhoon:"https://script.google.com/macros/s/AKfycbwIfxzNag9vc_56UpUrkKYsckgUwkUFo45n-aEYPM0i0xfTgQVpgRafHZF_rXpMGDjC/exec",warn:"https://script.google.com/macros/s/AKfycbyemP2KPcC_r-XySfr4YTX_4EfGThrV8j44NI4UX4j0ZeV8x6G2GAsxyRhRL-qeDDOQ/exec",quake:"https://script.google.com/macros/s/AKfycbzMY07T2v17M7maUZJBUzcnVpTDQubA8fQUA7s6VvDIsGSJIAEmpm5Q4A-q8jY3U_z2/exec"};
var NAMES={typhoon:"台風情報マップ",warn:"気象警報マップ",quake:"地震情報マップ"};
var PF={typhoon:[0,0,.408,.495],warn:[0,.505,.408,.495],quake:[.416,.143,.584,.714]};
var $=function(i){return document.getElementById(i)};
function dDef(){return{side:{on:true,text:"TEB防災情報"},top:{on:true,clock:true,badge:"TEB 防災情報",tag:"LIVE",place:"台風・気象警報・地震情報",lv:""},hl:{on:true,sub:"最新の情報は気象庁・自治体の発表でご確認ください",main:"TEB防災 マルチ情報"},tk:{on:true,label:"天気予報",speed:150,fs:36,sep:"　　　",lines:["□札幌  ☁️→☔ くもりのち雨［明日］　19℃ / 11℃ 降水確率 70%","□仙台  ☁️→☔ くもりのち雨［明日］　22℃ / 14℃ 降水確率 80%","□東京  ☁️→☔ くもりのち雨［明日］　23℃ / 17℃ 降水確率 30%","□名古屋 ☁️→☔ くもりのち雨［明日］　23℃ / 19℃ 降水確率 30%","□金沢  ☁️→☔ くもりのち雨［明日］　25℃ / 18℃ 降水確率 70%","□大阪  ☁️→☔ くもりのち雨［明日］　22℃ / 19℃ 降水確率 60%","□広島  ☁️→☔ くもりのち雨［明日］　24℃ / 19℃ 降水確率 60%","□福岡  ☁️→☀️ くもりのち晴れ［明日］　27℃ / 19℃ 降水確率 10%","□那覇  ☀️→☁️ 晴れのちくもり［明日］　31℃ / 25℃ 降水確率 30%"]},c:{blue:"#0a47d1",red:"#e3101c",bar:"#ffffff",bg:"#000000"}}}
/* 見出し・帯・テロップが使う場所を除いた「地図を置ける範囲」（キャンバスのピクセル）*/
function safe(S){var d=S.d,k=S.canvas.h/1080,b=(d.tk.on?K.TK:0)+(d.hl.on?K.HL+K.GAP:0)+(d.tk.on||d.hl.on?K.GAP:0),l=d.side.on?K.SIDE+K.GAP:0,t=d.top.on?K.TOP:0;return{x:l*k,y:t*k,w:S.canvas.w-l*k,h:S.canvas.h-(t+b)*k}}
function place(S){var s=safe(S);S.panels.forEach(function(p){var f=PF[p.id];p.x=Math.round(s.x+f[0]*s.w);p.y=Math.round(s.y+f[1]*s.h);p.w=Math.round(f[2]*s.w);p.h=Math.round(f[3]*s.h);p.crop=[0,0,1,1]})}
function mkS(){var S={v:2,ts:0,lock:true,canvas:{w:1920,h:1080},d:dDef(),panels:["typhoon","warn","quake"].map(function(id,i){return{id:id,name:NAMES[id],url:URLS[id],x:0,y:0,w:100,h:100,sw:1280,sh:720,crop:[0,0,1,1],z:i+1,on:true}})};place(S);return S}
function mg(a,b){if(b==null)return a;if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==="object"){var o={};for(var k in a)o[k]=mg(a[k],b[k]);return o}return typeof b===typeof a?b:a}
function norm(r){var S=mkS();if(!r||typeof r!=="object")return S;var n=mg(S,r);n.panels=S.panels.map(function(p){var q=(r.panels||[]).filter(function(x){return x&&x.id===p.id})[0];return q?mg(p,q):p});if(!(n.canvas.w>=320&&n.canvas.h>=180))n.canvas=S.canvas;return n}
function load(){var r=null;try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!r){var s=mkS();try{var o=JSON.parse(localStorage.getItem("teb-multiview-ticker-v1"));if(o&&Array.isArray(o.lines)){s.d.tk.lines=o.lines.map(String);if(typeof o.sep==="string")s.d.tk.sep=o.sep}}catch(e){}return s}return norm(r)}
var S=load(),seen={},peers=[],ID=Math.random().toString(36).slice(2),bc=null;
/* 同期：BroadcastChannel ＋ localStorage ＋ window.postMessage（開き元／子ウィンドウ）の3経路。どれか1つ通れば反映される */
try{bc=new BroadcastChannel("teb-mv")}catch(e){}
function ping(t,x){var m={teb:1,n:ID+Math.random(),t:t};if(t==="state")m.state=S;if(x)for(var k in x)m[k]=x[k];if(bc)try{bc.postMessage(m)}catch(e){}var ws=peers.slice();if(window.opener)ws.push(window.opener);ws.forEach(function(w){try{w.postMessage(m,"*")}catch(e){}})}
function commit(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}ping("state")}
function incoming(r){if(r&&r.ts>S.ts){try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}remote(r)}}
function recv(m){if(!m||!m.teb||seen[m.n])return;seen[m.n]=1;if(m.t==="state")incoming(norm(m.state));else if(m.t==="hello")ping("state");else if(window.onCmd)onCmd(m)}
if(bc)bc.onmessage=function(e){recv(e.data)};
addEventListener("message",function(e){recv(e.data)});
addEventListener("storage",function(e){if(e.key===KEY&&e.newValue){try{incoming(norm(JSON.parse(e.newValue)))}catch(x){}}});
setTimeout(function(){ping("hello")},400);

/* ===== 配信ページ ===== */
var stage=$("stage"),ov=$("ov"),body=document.body,scale=1,els={},selId=null,cropState=null,tkSig="";
function P(id){return S.panels.filter(function(p){return p.id===id})[0]}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2600)}
function toUnits(ev){var r=stage.getBoundingClientRect();return{x:(ev.clientX-r.left)/scale,y:(ev.clientY-r.top)/scale}}
function save(){commit()}function syncSide(){}function buildSide(){}function select(id){selId=id;layoutAll()}
function setSrc(p){els[p.id].ifr.src=p.url}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
S.panels.forEach(function(p){
  var wrap=document.createElement("div"),win=document.createElement("div"),ifr=document.createElement("iframe"),o=document.createElement("div");
  wrap.className="panel";win.className="win";ifr.setAttribute("allow","clipboard-read; clipboard-write; fullscreen; autoplay");ifr.title=p.name;ifr.src=p.url;win.appendChild(ifr);
  o.className="ov";o.innerHTML='<div class="tag"></div>'+["nw","n","ne","e","se","s","sw","w"].map(function(h){return'<i class="h" data-h="'+h+'"></i>'}).join("");
  wrap.appendChild(win);wrap.appendChild(o);stage.insertBefore(wrap,$("safe"));
  els[p.id]={wrap:wrap,win:win,ifr:ifr,ov:o,tag:o.querySelector(".tag")};bindPanel(p);
});
function fitStage(){var W=S.canvas.w,H=S.canvas.h;scale=Math.min(innerWidth/W,innerHeight/H);stage.style.width=W+"px";stage.style.height=H+"px";stage.style.transform="translate("+(innerWidth-W*scale)/2+"px,"+(innerHeight-H*scale)/2+"px) scale("+scale+")"}
function paint(e,p){var c=p.crop,cw=c[2]*p.sw,ch=c[3]*p.sh,k=Math.min(p.w/cw,p.h/ch),rw=cw*k,rh=ch*k;
  e.wrap.style.left=p.x+"px";e.wrap.style.top=p.y+"px";e.wrap.style.width=p.w+"px";e.wrap.style.height=p.h+"px";e.wrap.style.zIndex=String(p.z);e.wrap.style.display=p.on?"":"none";
  e.win.style.width=rw+"px";e.win.style.height=rh+"px";e.win.style.left=(p.w-rw)/2+"px";e.win.style.top=(p.h-rh)/2+"px";
  e.ifr.style.width=p.sw+"px";e.ifr.style.height=p.sh+"px";e.ifr.style.transform="translate("+(-c[0]*p.sw*k)+"px,"+(-c[1]*p.sh*k)+"px) scale("+k+")"}
function layout(p){var e=els[p.id];paint(e,p);e.tag.innerHTML=p.name+"<small>"+Math.round(p.w)+"×"+Math.round(p.h)+"</small>";e.wrap.classList.toggle("sel",p.id===selId)}
function layoutAll(){S.panels.forEach(layout);var s=safe(S),e=$("safe").style;e.left=s.x+"px";e.top=s.y+"px";e.width=s.w+"px";e.height=s.h+"px"}
function clampP(p){if(!S.lock)return;var s=safe(S);p.w=Math.min(p.w,Math.round(s.w));p.h=Math.min(p.h,Math.round(s.h));p.x=Math.round(Math.max(s.x,Math.min(p.x,s.x+s.w-p.w)));p.y=Math.round(Math.max(s.y,Math.min(p.y,s.y+s.h-p.h)))}
/* 見出し・帯・テロップ（高さ1080の仮想キャンバスで描き、キャンバスの大きさに合わせて拡縮）*/
var LC={1:["#d9d9d9","#111"],2:["#f2e600","#111"],3:["#e60012","#fff"],4:["#94159c","#fff"],5:["#000","#f2e600"]};
function lvHtml(s){return(s||"").split(/\r?\n/).map(function(l){var m=l.trim().match(/^([1-5])\s*(.*)$/);if(!m)return"";var c=LC[m[1]];return'<i style="background:'+c[0]+';color:'+c[1]+'"><b>Lv'+m[1]+'</b><span>'+esc(m[2])+'</span></i>'}).join("")}
function buildTk(){var t=S.d.tk,tk=$("tk"),sig=JSON.stringify([t.lines,t.sep,t.fs,t.speed,t.on,S.canvas.w,S.canvas.h,t.label]);if(sig===tkSig)return;tkSig=sig;tk.innerHTML="";
  var lines=t.lines.filter(function(l){return l.trim()!==""});if(!t.on||!lines.length)return;
  var text=lines.join(t.sep)+t.sep,pr=document.createElement("span");pr.className="tb-sp tb-probe";pr.textContent=text;tk.appendChild(pr);var w=pr.offsetWidth||1;tk.removeChild(pr);
  var n=Math.max(2,Math.ceil(S.canvas.w/(S.canvas.h/1080)/w)+1),dur=Math.max(8,w/t.speed);
  for(var i=0;i<n;i++){var tr=document.createElement("div"),sp=document.createElement("span");tr.className="tb-track";sp.className="tb-sp";sp.textContent=text;sp.style.animationDuration=dur+"s";tr.appendChild(sp);tk.appendChild(tr)}}
function renderOv(){var d=S.d,k=S.canvas.h/1080,c=d.c,t=d.top,s=ov.style,L=d.side.on?K.SIDE:0,B=d.tk.on?K.TK:0,sh=function(id,on){$(id).style.display=on?"":"none"};
  s.width=S.canvas.w/k+"px";s.height="1080px";s.transform="scale("+k+")";s.setProperty("--blue",c.blue);s.setProperty("--red",c.red);s.setProperty("--bar",c.bar);s.setProperty("--fs",d.tk.fs+"px");stage.style.setProperty("--bg",c.bg);
  sh("sd",d.side.on);$("sd").style.bottom=B+6+"px";var tx=d.side.text||"";$("sTx").textContent=tx;$("sTx").style.fontSize=Math.max(36,Math.min(112,(1080-B-80)/Math.max(1,tx.length)))+"px";
  sh("tp",t.on);$("tp").style.left=L+"px";sh("ck",t.clock);
  [["bd","badge"],["tg","tag"],["pl","place"]].forEach(function(m){$(m[0]).textContent=t[m[1]];sh(m[0],t[m[1]])});$("lv").innerHTML=lvHtml(t.lv);
  sh("hl",d.hl.on);$("hl").style.left=(L||8)+"px";$("hl").style.bottom=B+6+"px";$("h1").textContent=d.hl.sub;sh("h1",d.hl.sub);$("h2").textContent=d.hl.main;
  sh("br",d.tk.on);$("kb").textContent=d.tk.label;sh("kb",d.tk.label);buildTk();clock()}
function clock(){var n=new Date,p=function(x){return String(x).padStart(2,"0")};$("ck").textContent=p(n.getHours())+":"+p(n.getMinutes())}
setInterval(clock,1000);setInterval(function(){ping("beat")},2000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){tkSig="";buildTk()});
/* 設定ページからの更新を反映（URLが変わった枠だけ読み込み直す）*/
function remote(r){if(cropState)return;S.ts=r.ts;S.canvas=r.canvas;S.d=r.d;S.lock=r.lock;r.panels.forEach(function(rp){var p=P(rp.id),u=p.url;Object.assign(p,rp);if(u!==p.url)setSrc(p)});fitStage();layoutAll();renderOv()}
/* ---------- 枠の移動・サイズ変更 ---------- */
  function bindPanel(p) {
    var ov = els[p.id].ov;
    ov.addEventListener("pointerdown", function (ev) {
      if (!body.classList.contains("edit") || cropState) return;
      ev.preventDefault();
      select(p.id);
      var hnd = ev.target.dataset ? ev.target.dataset.h : null;
      var st = { x: p.x, y: p.y, w: p.w, h: p.h }, u0 = toUnits(ev);
      ov.setPointerCapture(ev.pointerId);
      function move(e) {
        var u = toUnits(e), dx = Math.round(u.x - u0.x), dy = Math.round(u.y - u0.y), MIN = 120;
        if (!hnd) { p.x = st.x + dx; p.y = st.y + dy; }
        else {
          var l = st.x, t = st.y, r = st.x + st.w, b = st.y + st.h;
          if (hnd.indexOf("w") >= 0) l = Math.min(l + dx, r - MIN);
          if (hnd.indexOf("e") >= 0) r = Math.max(r + dx, l + MIN);
          if (hnd.indexOf("n") >= 0) t = Math.min(t + dy, b - MIN);
          if (hnd.indexOf("s") >= 0) b = Math.max(b + dy, t + MIN);
          p.x = l; p.y = t; p.w = r - l; p.h = b - t;
        }
        clampP(p); layout(p);
      }
      function up() { ov.removeEventListener("pointermove", move); ov.removeEventListener("pointerup", up); ov.removeEventListener("pointercancel", up); save(); }
      ov.addEventListener("pointermove", move); ov.addEventListener("pointerup", up); ov.addEventListener("pointercancel", up);
    });
  }

  
/* ---------- 切り抜きモード ---------- */
  function startCrop(p) {
    var W = S.canvas.w, H = S.canvas.h, k0 = Math.min((W - 80) / p.sw, (H - 100) / p.sh);
    var ww = p.sw * k0, wh = p.sh * k0, e = els[p.id];
    cropState = { p: p, k0: k0, ww: ww, wh: wh, saved: { x: p.x, y: p.y, w: p.w, h: p.h, z: p.z },
      box: { l: p.crop[0] * ww, t: p.crop[1] * wh, r: (p.crop[0] + p.crop[2]) * ww, b: (p.crop[1] + p.crop[3]) * wh } };
    body.classList.add("cropping");
    e.wrap.style.left = (W - ww) / 2 + "px"; e.wrap.style.top = (H - wh) / 2 - 10 + "px";
    e.wrap.style.width = ww + "px"; e.wrap.style.height = wh + "px"; e.wrap.style.zIndex = "1000"; e.wrap.style.display = "";
    e.win.style.cssText = "left:0;top:0;width:" + ww + "px;height:" + wh + "px";
    e.ifr.style.width = p.sw + "px"; e.ifr.style.height = p.sh + "px"; e.ifr.style.transform = "scale(" + k0 + ")";
    var cb = document.createElement("div"); cb.className = "cropbox";
    cb.innerHTML = '<div class="size"></div>' + ["nw", "n", "ne", "e", "se", "s", "sw", "w"].map(function (h) { return '<i class="h" data-h="' + h + '"></i>'; }).join("");
    e.win.appendChild(cb); cropState.el = cb; drawBox();
    cb.addEventListener("pointerdown", cropDown);
  }
  function drawBox() {
    var s = cropState, b = s.box, el = s.el, p = s.p;
    el.style.left = b.l + "px"; el.style.top = b.t + "px"; el.style.width = (b.r - b.l) + "px"; el.style.height = (b.b - b.t) + "px";
    el.querySelector(".size").textContent = Math.round((b.r - b.l) / s.ww * p.sw) + " × " + Math.round((b.b - b.t) / s.wh * p.sh) + " px";
  }
  function cropRatio() { var s = cropState, p = s.p; return p.w / p.h; }   // 切り抜き範囲の縦横比（ピクセル）= 枠の縦横比
  function cropDown(ev) {
    var s = cropState; if (!s) return; ev.preventDefault();
    var hnd = ev.target.dataset ? ev.target.dataset.h : null, st = { l: s.box.l, t: s.box.t, r: s.box.r, b: s.box.b };
    var x0 = ev.clientX, y0 = ev.clientY, el = s.el, lock = $("cropLock").checked;
    var R = cropRatio();   // ボックス（元ページと同じ縦横比の座標）での 幅/高さ ＝ 枠の縦横比
    el.setPointerCapture(ev.pointerId);
    function move(e) {
      var dx = (e.clientX - x0) / scale, dy = (e.clientY - y0) / scale;   // 画面px → ステージ座標（ウィンドウ座標と同じ）
      var nb = { l: st.l, t: st.t, r: st.r, b: st.b }, MIN = 30;
      if (!hnd) {
        var w = st.r - st.l, h = st.b - st.t;
        nb.l = Math.max(0, Math.min(s.ww - w, st.l + dx)); nb.t = Math.max(0, Math.min(s.wh - h, st.t + dy)); nb.r = nb.l + w; nb.b = nb.t + h;
      } else {
        if (hnd.indexOf("w") >= 0) nb.l = Math.min(st.l + dx, st.r - MIN);
        if (hnd.indexOf("e") >= 0) nb.r = Math.max(st.r + dx, st.l + MIN);
        if (hnd.indexOf("n") >= 0) nb.t = Math.min(st.t + dy, st.b - MIN);
        if (hnd.indexOf("s") >= 0) nb.b = Math.max(st.b + dy, st.t + MIN);
        if (lock) {
          var corner = hnd.length === 2, nw = nb.r - nb.l, nh = nb.b - nb.t, cx = (st.l + st.r) / 2, cy = (st.t + st.b) / 2;
          if (corner) {
            nh = nw / R;
            if (hnd.indexOf("n") >= 0) nb.t = nb.b - nh; else nb.b = nb.t + nh;
          } else if (hnd === "e" || hnd === "w") {
            nh = nw / R; nb.t = cy - nh / 2; nb.b = cy + nh / 2;
          } else {
            nw = nh * R; nb.l = cx - nw / 2; nb.r = cx + nw / 2;
          }
        }
        if (nb.l < 0 || nb.t < 0 || nb.r > s.ww || nb.b > s.wh || nb.r - nb.l < MIN || nb.b - nb.t < MIN) return;   // はみ出す変形は無視
      }
      s.box = nb; drawBox();
    }
    function up() { el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); }
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  }
  function endCrop(apply, all) {
    var s = cropState; if (!s) return;
    var p = s.p;
    if (apply) {
      var b = s.box;
      p.crop = all ? [0, 0, 1, 1] : [b.l / s.ww, b.t / s.wh, (b.r - b.l) / s.ww, (b.b - b.t) / s.wh];
      if (all || $("cropFit").checked) p.h = Math.max(60, Math.round(p.w * (p.crop[3] * p.sh) / (p.crop[2] * p.sw)));
    }
    s.el.remove(); s.el = null; els[p.id].win.style.cssText = ""; cropState = null;
    body.classList.remove("cropping");
    layoutAll(); buildSide(); save();
    if (apply) toast(all ? "切り抜きを解除しました" : "切り抜きを適用しました");
  }
  $("cropOk").onclick = function () { endCrop(true, false); };
  $("cropAll").onclick = function () { endCrop(true, true); };
  $("cropCancel").onclick = function () { endCrop(false); };

  
function setEdit(on){if(!on&&cropState)endCrop(false);body.classList.toggle("edit",on);if(!on){selId=null;layoutAll()}}
window.onCmd=function(m){if(m.t!=="cmd")return;if(m.cmd==="edit")setEdit(!body.classList.contains("edit"));
  else if(m.cmd==="crop"){var p=P(m.id);if(p){setEdit(false);startCrop(p)}}
  else if(m.cmd==="reload"){var p2=P(m.id),f=els[m.id].ifr;f.src="about:blank";setTimeout(function(){f.src=p2.url},60)}};
addEventListener("keydown",function(e){if(e.key==="Escape"&&cropState){endCrop(false);return}if((e.key==="e"||e.key==="E")&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!cropState)setEdit(!body.classList.contains("edit"))});
stage.addEventListener("pointerdown",function(e){if(body.classList.contains("edit")&&!cropState&&e.target===stage){selId=null;layoutAll()}});
addEventListener("resize",fitStage);
fitStage();layoutAll();renderOv();
</script>
</body>
